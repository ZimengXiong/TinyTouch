name: CI

on:
  push:
    branches:
      - main
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  firmware:
    runs-on: ubuntu-latest
    container: espressif/idf:release-v5.3
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
      - name: Build factory firmware
        run: |
          source /opt/esp/idf/export.sh
          idf.py -C firmware/tiny_touch_smartcard build
      - name: Build recovery firmware
        run: |
          source /opt/esp/idf/export.sh
          idf.py -C firmware/tiny_touch_smartcard -B firmware/tiny_touch_smartcard/build-recovery -D TINYTOUCH_RECOVERY_BUILD=ON build
      - name: Assemble and verify browser artifacts
        run: |
          source /opt/esp/idf/export.sh
          python packaging/assemble-release.py \
            --firmware-build firmware/tiny_touch_smartcard/build \
            --recovery-build firmware/tiny_touch_smartcard/build-recovery \
            --web-root web
          python - <<'PY'
          import hashlib, json
          from pathlib import Path
          for root in (Path("web/flasher"), Path("web/recovery")):
              manifest = json.loads((root / "manifest.json").read_text())
              assert manifest["compress"] is False
              for image in manifest["images"]:
                  path = root / "firmware" / image["file"]
                  assert path.stat().st_size == image["size"]
                  assert hashlib.sha256(path.read_bytes()).hexdigest() == image["sha256"]
          PY
      - uses: actions/upload-artifact@v7
        with:
          name: firmware-release
          path: dist/release

  macos-cli:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          architecture: arm64
      - name: Test CLI and HID protocol
        run: |
          python -m pip install -r software/macos-helper/requirements.txt
          python -m unittest discover -s tests -v
          python -m py_compile tinytouch software/macos-helper/tinytouch_helper.py packaging/*.py
          zsh -n packaging/build-standalone-macos.sh firmware/build-and-flash firmware/build-recovery
          node --check web/flasher/app.js
          node --check web/recovery/app.js
      - name: Build Apple Silicon executable
        env:
          TINYTOUCH_SIGNING_IDENTITY: "-"
        run: packaging/build-standalone-macos.sh
      - name: Verify executable
        run: |
          test "$(dist/tinytouch --version | tail -n 1)" = "tinyTouch CLI $(tr -d '[:space:]' < VERSION)"
          codesign --verify --strict --verbose=2 dist/tinytouch
          file dist/tinytouch | grep -q arm64
      - uses: actions/upload-artifact@v7
        with:
          name: tinytouch-macos-arm64
          path: dist/tinytouch

  consistency:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Verify release sources
        run: |
          test -s VERSION
          python3 -m py_compile tinytouch packaging/*.py
          node --check web/flasher/app.js
          node --check web/recovery/app.js
          ! grep -q "compress:true" web/flasher/app.js web/recovery/app.js
